schema_version: 1
package:
  name: remote-workstation-sdk
  version: 1.0.0
source:
  url: https://github.com/titanfyre/Remote-Workstation-SDK/releases/download/language-sdks-v1.0.0/remote-workstation-sdk-sdk-source-1.0.0.zip
  sha256: 75509c49feecb829f1d24ee62ede47b5d7e6764128d8ab53c2fcbb1481103aa3
build:
  number: 0
  skip:
  - target_platform != "win-64"
  - match(python, "<3.10")
  script:
    file: build.bat
requirements:
  build:
  - ${{ compiler("c") }}
  - ${{ compiler("cxx") }}
  - ${{ stdlib("c") }}
  - cmake >=3.24
  - ninja
  host:
  - python
  - pip
  - setuptools >=77
  - wheel
  run:
  - python
tests:
- python:
    imports:
    - remote_workstation_sdk
    pip_check: true
- script:
  - python -m pip check
  - python -c "from remote_workstation_sdk import Client; client=Client(); client.close()"
  requirements:
    run:
    - pip
about:
  homepage: https://github.com/titanfyre/Remote-Workstation-SDK
  summary: Windows x64 Remote-Workstation-SDK Python SDK with source-built native bridge
  license: MIT
  license_file:
  - Remote-Workstation-SDK-C-ffi/LICENSE
  - Remote-Workstation-SDK-C-ffi/third_party/LICENSE.nlohmann-json
extra:
  recipe-maintainers:
  - TitanCSA
